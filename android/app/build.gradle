plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Charger les propriétés du keystore depuis android/key.properties (non versionné)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.resumeplus.jeycode"
    compileSdk = 36
    // NDK 25.1 était corrompu (téléchargement interrompu, dossier vide).
    // NDK 23.0.7599858 déjà installé et complet — aucun code natif dans l'app.
    ndkVersion = "23.0.7599858"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        // Enable core library desugaring for older Android versions
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId = "com.resumeplus.jeycode"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = 15
        versionName = "1.0.9"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Signature release via android/key.properties (fallback debug si absent)
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    // ABI splits - generate a universal APK and per-ABI splits
    // This ensures both 32-bit (armeabi-v7a) and 64-bit (arm64-v8a) native libs are available
    // when installing debug APKs, preventing libflutter.so missing errors.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            // Also build a universal APK that bundles all ABIs for easy sideloading
            universalApk true
        }
    }

    // Alignement natif 16 ko (exigence Google Play Android 15/16) :
    // les bibliothèques .so sont stockées NON compressées et alignées,
    // compatibles avec les appareils à pages mémoire de 16 ko.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    // Core library desugaring for older Android versions (fixes record plugin Bluetooth issue)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    // Badge sur icône d'application (ShortcutBadger)
    implementation 'me.leolin:ShortcutBadger:1.1.22@aar'
}

flutter {
    source = "../.."
}
