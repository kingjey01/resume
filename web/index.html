<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Muhtasari+ — résumés de cours, QCM personnalisés et résumés audio pour les étudiants.">
  <meta name="theme-color" content="#1A237E">

  <!-- PWA / iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Muhtasari+">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Muhtasari+</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0D1642;
      overflow: hidden;
    }

    #pwa-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: linear-gradient(160deg, #0D1642 0%, #1A237E 60%, #3949AB 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity 350ms ease;
    }

    #pwa-splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #pwa-splash img {
      width: 104px;
      height: 104px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    #pwa-splash .app-name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    #pwa-splash .spinner {
      width: 26px;
      height: 26px;
      margin-top: 4px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: pwa-spin 0.9s linear infinite;
    }

    @keyframes pwa-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="pwa-splash">
    <img src="icons/Icon-192.png" alt="Muhtasari+">
    <div class="app-name">Muhtasari+</div>
    <div class="spinner" aria-label="Chargement"></div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="flutter_bootstrap.js" async></script>

  <script>
    (function () {
      var splash = document.getElementById('pwa-splash');
      var hidden = false;

      function hideSplash() {
        if (hidden || !splash) return;
        hidden = true;
        splash.classList.add('is-hidden');
        setTimeout(function () {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 400);
      }

      // Flutter émet cet événement au premier rendu réel de l'application.
      window.addEventListener('flutter-first-frame', hideSplash);

      // Filet de sécurité : ne jamais laisser l'écran de chargement bloqué.
      setTimeout(hideSplash, 15000);

      // Service worker PWA (mis en cache par sw.js, pas par Flutter).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function (error) {
            console.warn('[PWA] service worker non enregistré :', error);
          });
        });
      }
    })();
  </script>
</body>
</html>
