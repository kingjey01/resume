# Codemagic — build iOS (IPA) de Muhtasari+ / resume_plus_clean
#
# CE QUI A CHANGÉ, ET POURQUOI
#
# Le build échouait sur « no such module 'FirebaseCore' » dans
# ios/Runner/AppDelegate.swift. Ce n'est ni la signature ni le Swift : c'est
# l'intégration des Pods. Deux causes possibles, traitées ensemble ici :
#
#   a) un Pods/ ou un Podfile.lock hérité d'un état antérieur — l'application
#      était alors compilée contre une liste de plugins périmée ;
#   b) un `pod install` qui n'intègre pas firebase_core alors que le paquet est
#      bien déclaré dans pubspec.yaml.
#
# Les Pods sont donc réinstallés DE ZÉRO, et le workflow VÉRIFIE ensuite que
# Firebase est réellement intégré. Si ce n'est pas le cas, il s'arrête tout de
# suite en affichant la liste des plugins iOS que Flutter a détectés — au lieu
# d'échouer cinq minutes plus tard sur une erreur Swift qui ne dit pas pourquoi.

workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: resumeplus

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        # UN SEUL PROFIL, ET LE BON (tâche 55/56).
        #
        # Le build précédent a échoué parce qu'il a retenu un profil créé AVANT
        # l'activation de Push sur l'App ID :
        #
        #   Provisioning profile "muhtasari AppStore" doesn't include the Push
        #   Notifications capability / the aps-environment entitlement.
        #
        # `muhtasari AppStore V2` est le profil régénéré avec la capacité Push.
        # On ne liste QUE lui : laisser figurer les anciens laisserait
        # `xcode-project use-profiles` choisir un profil incomplet.
        #
        # À VÉRIFIER dans Codemagic : ce profil doit être présent dans les
        # identités de signature iOS, sous ce nom exact.
        provisioning_profiles:
          - "muhtasari AppStore V2"
        # Le certificat ne dépend pas du Bundle ID : inchangé.
        certificates:
          - "resume key"

    scripts:
      - name: Initialize keychain
        script: |
          keychain initialize

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Get Flutter packages and install Pods
        script: |
          set -e

          # pubspec.yaml est à la racine du dépôt : le log de build le confirme
          # (/Users/builder/clone/ios/Runner/AppDelegate.swift). Plus besoin de
          # le chercher, donc plus de chemin qui puisse se tromper de dossier.
          test -f pubspec.yaml || { echo "ERROR: pubspec.yaml absent de la racine."; exit 1; }
          test -f ios/Podfile  || { echo "ERROR: ios/Podfile absent."; ls -la ios; exit 1; }

          # CONTRÔLE DES .xcconfig (ajouté après l'échec d'archivage du 13/10).
          # Un fichier .xcconfig ne connaît QUE les commentaires « // ». Une ligne
          # commençant par « # » est lue comme une directive du préprocesseur, et
          # c'est alors TOUT le fichier qui devient illisible — y compris les
          # `#include` des Pods, pourtant corrects :
          #
          #     error: unsupported preprocessor directive 'L'INCLUDE'
          #     error: unexpected end-of-line after '#'
          #     ** ARCHIVE FAILED **   (en 6 secondes)
          #
          # Le message ne parle pas de commentaires : sans ce garde-fou, on ne
          # comprend l'erreur qu'en relisant le fichier ligne à ligne.
          lignes_invalides=$(grep -nE '^#' ios/Flutter/Debug.xcconfig ios/Flutter/Release.xcconfig \
                             | grep -vE '^[^:]+:[0-9]+:#[[:space:]]*include' || true)
          if [ -n "$lignes_invalides" ]; then
            echo "ERROR: commentaire en '#' dans un .xcconfig — la syntaxe est « // »."
            echo "Ces lignes seront lues comme des directives et casseront l'archivage :"
            echo "$lignes_invalides"
            exit 1
          fi

          # CONTRÔLE DES ACCÈS SENSIBLES (ajouté après ITMS-90683).
          # L'application lit la photothèque (photo de profil) et le microphone
          # (enregistrement d'un cours). Sans la clé correspondante, App Store
          # Connect refuse la livraison — et le binaire reste introuvable dans
          # App Store Connect, ce qui ne dit pas pourquoi. Autant l'apprendre ici,
          # en quelques secondes, plutôt qu'après un build et un envoi complets.
          for cle in NSPhotoLibraryUsageDescription NSMicrophoneUsageDescription NSAppleMusicUsageDescription; do
            if ! plutil -extract "$cle" raw ios/Runner/Info.plist >/dev/null 2>&1; then
              echo "ERROR: $cle absent de ios/Runner/Info.plist."
              echo "App Store Connect refusera la livraison (ITMS-90683)."
              exit 1
            fi
          done
          echo "Declarations d'acces sensibles : OK"

          # CONTRÔLE DU FICHIER FIREBASE iOS (ajouté après le plantage au
          # lancement signalé depuis l'iPhone : « resumeplus a quitté »).
          #
          # AppDelegate.swift appelle FirebaseApp.configure() AVANT que Flutter
          # ne démarre. Sans GoogleService-Info.plist DANS LE BUNDLE, cette ligne
          # lève une exception et l'application se ferme aussitôt.
          #
          # Le piège : le fichier peut être présent dans le dépôt SANS être
          # membre de la cible Xcode — un fichier non membre n'est jamais copié
          # dans le .app. C'était le cas ici : GoogleService-Info.plist
          # n'apparaissait nulle part dans project.pbxproj, donc l'application
          # n'avait jamais pu démarrer sur iOS.
          test -f ios/Runner/GoogleService-Info.plist \
            || { echo "ERROR: ios/Runner/GoogleService-Info.plist absent du depot."; exit 1; }
          grep -q "GoogleService-Info.plist in Resources" ios/Runner.xcodeproj/project.pbxproj \
            || { echo "ERROR: GoogleService-Info.plist n'est pas membre de la cible Runner."; \
                 echo "Il ne sera pas copie dans le bundle, et l'app plantera au lancement."; \
                 exit 1; }
          echo "GoogleService-Info.plist : present dans le depot et dans la cible"

          flutter --version

          # SWIFT PACKAGE MANAGER DÉSACTIVÉ — C'EST LA CAUSE DE « no such module
          # 'FirebaseCore' », et elle ne vient pas du projet.
          #
          # Flutter 3.47 gère les plugins iOS par SPM PAR DÉFAUT : `flutter
          # config` affiche « --[no-]enable-swift-package-manager ... (defaults
          # to on) ». Conséquence dans le log du 13/10 : Flutter détectait bien
          # 17 plugins iOS (firebase_core et firebase_messaging compris), mais
          # seuls 6 — ceux sans support SPM — passaient encore par CocoaPods :
          #
          #     Pod installation complete! There are 6 dependencies from the
          #     Podfile and 6 total pods installed.
          #
          # FirebaseCore n'était donc plus dans Podfile.lock, et
          # `import FirebaseCore` échouait dans AppDelegate.swift.
          #
          # Ce projet est intégré par CocoaPods (Podfile, pods Firebase, profil
          # de signature) : on repasse TOUS les plugins par CocoaPods. C'est le
          # seul réglage qui remet FirebaseCore dans Podfile.lock.
          flutter config --no-enable-swift-package-manager

          flutter clean
          flutter pub get

          # RÉINSTALLATION COMPLÈTE DES PODS. Un Pods/ ou un Podfile.lock
          # hérité ferait compiler l'application contre la liste de plugins
          # d'hier — c'est exactement ce que produit « no such module
          # 'FirebaseCore' » alors que firebase_core est dans pubspec.yaml.
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks

          cd ios
          pod install --repo-update
          cd ..

          # COMBIEN DE PODS ? Un total anormalement bas — 6 — signait le passage
          # des plugins par Swift Package Manager. On l'affiche à chaque build,
          # pour que la prochaine régression de ce genre se voie d'un coup d'œil.
          nb_pods=$(grep -c '^  - ' ios/Podfile.lock || echo 0)
          echo "Pods installés : $nb_pods"

          # CONTRÔLE 1 : Firebase est-il réellement intégré ?
          if ! grep -q "FirebaseCore" ios/Podfile.lock; then
            echo "ERROR: FirebaseCore absent de ios/Podfile.lock."
            echo "Si le nombre de pods ci-dessus est très bas, les plugins sont"
            echo "repartis par Swift Package Manager : vérifier que l'étape a bien"
            echo "exécuté 'flutter config --no-enable-swift-package-manager'."
            echo "Plugins iOS détectés par Flutter (.flutter-plugins-dependencies) :"
            cat .flutter-plugins-dependencies || echo "(fichier absent)"
            echo "Contenu de ios/Pods :"
            ls ios/Pods || true
            exit 1
          fi

          # CONTRÔLE 2 : l'espace de travail référence-t-il le projet Pods ?
          # `xcodebuild -workspace ios/Runner.xcworkspace` ignore silencieusement
          # les Pods si cette référence manque, et l'application ne voit alors
          # aucun module de plugin.
          if ! grep -q "Pods/Pods.xcodeproj" ios/Runner.xcworkspace/contents.xcworkspacedata; then
            echo "ERROR: ios/Runner.xcworkspace ne référence pas Pods/Pods.xcodeproj."
            cat ios/Runner.xcworkspace/contents.xcworkspacedata
            exit 1
          fi

          echo "Pods intégrés :"
          grep -n "Firebase" ios/Podfile.lock | head -20

      - name: Set up code signing settings on Xcode project
        script: |
          set -e
          xcode-project use-profiles

      - name: Build IPA and preserve diagnostic log
        script: |
          set -o pipefail

          # Xcode 26 active les modules Swift explicites par défaut ; les pods
          # Flutter ne les gèrent pas encore (même réglage dans ios/Podfile).
          export SWIFT_ENABLE_EXPLICIT_MODULES=NO

          mkdir -p /tmp/xcodebuild_logs
          LOG_FILE="/tmp/xcodebuild_logs/codemagic-build-ipa-console.log"

          set +e
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner 2>&1 | tee "$LOG_FILE"
          statut=${PIPESTATUS[0]}
          set -e

          if [ "$statut" -ne 0 ]; then
            # LE DÉTAIL N'EST PAS DANS LA CONSOLE, ET C'EST TOUT LE PROBLÈME.
            # `xcode-project` n'affiche que ses grandes étapes ; l'erreur de
            # compilation, elle, part dans ses propres journaux sous
            # /tmp/xcodebuild_logs/. Sans ce bloc, un échec d'archive tient en
            # trois lignes — « Failed to archive » — sans dire pourquoi, et il
            # faut relancer un build entier pour apprendre quelque chose.
            echo "===== xcodebuild a échoué (code $statut) — détail ci-dessous ====="
            ls -la /tmp/xcodebuild_logs
            for journal in /tmp/xcodebuild_logs/*.log; do
              [ "$journal" = "$LOG_FILE" ] && continue
              echo "----- $journal : 250 dernières lignes -----"
              tail -250 "$journal"
            done
            exit "$statut"
          fi

          # CE QUE LE BINAIRE CONTIENT RÉELLEMENT. Un Info.plist correct dans le
          # dépôt ne prouve rien : c'est le seul contrôle qui compte, et il a
          # fallu un plantage au lancement pour s'en rendre compte (voir
          # GoogleService-Info.plist). On lit donc l'Info.plist EMBARQUÉ dans
          # l'IPA, pas celui du dépôt.
          ipa=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -1)
          if [ -n "$ipa" ]; then
            echo "=== Info.plist embarque dans $(basename "$ipa") ==="
            unzip -p "$ipa" "Payload/Runner.app/Info.plist" | plutil -p - \
              | grep -E "UsageDescription|ITSAppUsesNonExemptEncryption|UIRequiresFullScreen" || true
            echo "=== fichiers embarques (extrait) ==="
            unzip -l "$ipa" | grep -E "GoogleService|Runner.app/Info.plist" || true
          else
            echo "AVERTISSEMENT: aucun IPA trouve pour verifier son contenu."
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration

        # `submit_to_testflight: false` — LA REVUE BÊTA N'EST PAS NÉCESSAIRE POUR
        # TESTER SUR SON PROPRE TÉLÉPHONE. Elle ne concerne que les testeurs
        # EXTERNES, et elle exige des informations qui ne vivent que dans le
        # formulaire App Store Connect :

        #   Failure: Complete test information is required to submit application
        #   resumeplus build for external testing.
        #   App is missing required Beta App Information: Feedback Email.
        #   App is missing required Beta App Review Information: First Name,
        #   Last Name, Phone Number, Email.
        #   Fill in test information at
        #   https://appstoreconnect.apple.com/apps/6821171863/testflight/test-info

        # Tant que ce formulaire n'est pas rempli, demander la soumission fait
        # ÉCHOUER l'étape de publication — alors que le binaire, lui, est monté
        # et traité, et déjà installable par les testeurs INTERNES (aucune revue
        # pour eux). On remettra `true` le jour où des testeurs externes seront
        # invités, le formulaire rempli.
        submit_to_testflight: false
