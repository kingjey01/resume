# Codemagic — build iOS (IPA) de Muhtasari+ / resume_plus_clean
#
# CE QUI A CHANGÉ, ET POURQUOI
#
# Le build échouait sur « no such module 'FirebaseCore' » dans
# ios/Runner/AppDelegate.swift. Ce n'est ni la signature ni le Swift : c'est
# l'intégration des Pods. Deux causes possibles, traitées ensemble ici :
#
#   a) un Pods/ ou un Podfile.lock hérité d'un état antérieur — l'application
#      était alors compilée contre une liste de plugins périmée ;
#   b) un `pod install` qui n'intègre pas firebase_core alors que le paquet est
#      bien déclaré dans pubspec.yaml.
#
# Les Pods sont donc réinstallés DE ZÉRO, et le workflow VÉRIFIE ensuite que
# Firebase est réellement intégré. Si ce n'est pas le cas, il s'arrête tout de
# suite en affichant la liste des plugins iOS que Flutter a détectés — au lieu
# d'échouer cinq minutes plus tard sur une erreur Swift qui ne dit pas pourquoi.

workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: resumeplus

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - "provider App store"
        certificates:
          - "resume key"

    scripts:
      - name: Initialize keychain
        script: |
          keychain initialize

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Get Flutter packages and install Pods
        script: |
          set -e

          # pubspec.yaml est à la racine du dépôt : le log de build le confirme
          # (/Users/builder/clone/ios/Runner/AppDelegate.swift). Plus besoin de
          # le chercher, donc plus de chemin qui puisse se tromper de dossier.
          test -f pubspec.yaml || { echo "ERROR: pubspec.yaml absent de la racine."; exit 1; }
          test -f ios/Podfile  || { echo "ERROR: ios/Podfile absent."; ls -la ios; exit 1; }

          flutter --version
          flutter clean
          flutter pub get

          # RÉINSTALLATION COMPLÈTE DES PODS. Un Pods/ ou un Podfile.lock
          # hérité ferait compiler l'application contre la liste de plugins
          # d'hier — c'est exactement ce que produit « no such module
          # 'FirebaseCore' » alors que firebase_core est dans pubspec.yaml.
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks

          cd ios
          pod install --repo-update
          cd ..

          # CONTRÔLE 1 : Firebase est-il réellement intégré ?
          if ! grep -q "FirebaseCore" ios/Podfile.lock; then
            echo "ERROR: FirebaseCore absent de ios/Podfile.lock."
            echo "Plugins iOS détectés par Flutter (.flutter-plugins-dependencies) :"
            cat .flutter-plugins-dependencies || echo "(fichier absent)"
            echo "Contenu de ios/Pods :"
            ls ios/Pods || true
            exit 1
          fi

          # CONTRÔLE 2 : l'espace de travail référence-t-il le projet Pods ?
          # `xcodebuild -workspace ios/Runner.xcworkspace` ignore silencieusement
          # les Pods si cette référence manque, et l'application ne voit alors
          # aucun module de plugin.
          if ! grep -q "Pods/Pods.xcodeproj" ios/Runner.xcworkspace/contents.xcworkspacedata; then
            echo "ERROR: ios/Runner.xcworkspace ne référence pas Pods/Pods.xcodeproj."
            cat ios/Runner.xcworkspace/contents.xcworkspacedata
            exit 1
          fi

          echo "Pods intégrés :"
          grep -n "Firebase" ios/Podfile.lock | head -20

      - name: Set up code signing settings on Xcode project
        script: |
          set -e
          xcode-project use-profiles

      - name: Build IPA and preserve diagnostic log
        script: |
          set -o pipefail

          # Xcode 26 active les modules Swift explicites par défaut ; les pods
          # Flutter ne les gèrent pas encore (même réglage dans ios/Podfile).
          export SWIFT_ENABLE_EXPLICIT_MODULES=NO

          mkdir -p /tmp/xcodebuild_logs
          LOG_FILE="/tmp/xcodebuild_logs/codemagic-build-ipa-console.log"

          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner 2>&1 | tee "$LOG_FILE"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
