workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: resumeplus
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - "provider App store"
        certificates:
          - "resume key"
    scripts:
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Clean and Regenerate iOS Pods
        script: |
          flutter clean
          flutter pub get
          cd ios
          rm -f Podfile.lock
          rm -rf Pods
          pod install --repo-update
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Disable Explicit Modules for Xcode 26
        script: |
          # Désactive les modules explicites pour éviter l'erreur ScanDependencies sur Xcode 26
          sed -i '' 's/SWIFT_ENABLE_EXPLICIT_MODULES = YES/SWIFT_ENABLE_EXPLICIT_MODULES = NO/g' ios/Runner.xcodeproj/project.pbxproj
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true